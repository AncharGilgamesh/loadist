[project]
name = "loadist"
version = "0.1.0"
requires-python = ">=3.9,<3.12"
dependencies = [
    "openpyxl==3.1.2",
    "pyqt5==5.15.9",
    "pyqt5-qt5==5.15.2",
    "pyqt5-sip==12.12.1",
    "xlrd==2.0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py39"
line-length = 88
extend-exclude = [
    "Resources/breeze_resources.py",
    "Resources/res_images.py",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
